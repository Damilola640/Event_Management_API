<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Event — Eventflow</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body data-page="edit-event" data-title="Edit event">
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-body">
      <header id="app-topbar" class="app-topbar"></header>
      <main class="app-main">

        <div id="edit-event-status" class="app-message">Loading event…</div>

        <div id="edit-event-body" hidden>
          <section class="app-card" style="margin-bottom:1.5rem">
            <h2 class="app-section-title" style="margin-top:0">Event details</h2>

            <form id="edit-event-form" novalidate>
              <div class="event-builder-grid">
                <div class="form-group event-builder-span-2">
                  <label for="event-name-input">Event name</label>
                  <input type="text" id="event-name-input" name="name" autocomplete="off" />
                </div>

                <div class="form-group event-builder-span-2">
                  <label for="event-description-input">Description</label>
                  <textarea id="event-description-input" name="description" rows="5"></textarea>
                </div>

                <div class="form-group">
                  <label for="event-start-date-input">Start date</label>
                  <input type="date" id="event-start-date-input" name="start_date" />
                </div>
                <div class="form-group">
                  <label for="event-end-date-input">End date</label>
                  <input type="date" id="event-end-date-input" name="end_date" />
                </div>
                <div class="form-group">
                  <label for="event-start-time-input">Start time</label>
                  <input type="time" id="event-start-time-input" name="start_time" />
                </div>
                <div class="form-group">
                  <label for="event-end-time-input">End time</label>
                  <input type="time" id="event-end-time-input" name="end_time" />
                </div>

                <div class="form-group">
                  <label for="event-venue-input">Venue</label>
                  <select id="event-venue-input" name="venue">
                    <option value="">Loading venues…</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="event-location-details-input">Location details</label>
                  <input type="text" id="event-location-details-input" name="location_details" />
                </div>

                <div class="form-group">
                  <label for="event-capacity-input">Capacity</label>
                  <input type="number" id="event-capacity-input" name="max_attendees" min="0" step="1" />
                </div>
                <div class="form-group">
                  <label for="event-price-input">Ticket price</label>
                  <input type="number" id="event-price-input" name="ticket_price" min="0" step="0.01" />
                </div>

                <div class="form-group">
                  <label for="event-categories-input">Categories</label>
                  <select id="event-categories-input" name="categories" multiple size="5"></select>
                  <span class="form-hint">Hold Ctrl or Cmd to select more than one.</span>
                </div>
                <div class="form-group">
                  <label for="event-tags-input">Tags</label>
                  <select id="event-tags-input" name="tags" multiple size="5"></select>
                  <span class="form-hint">Hold Ctrl or Cmd to select more than one.</span>
                </div>
              </div>

              <label class="event-builder-toggle">
                <input type="checkbox" name="is_private" />
                <span>Make this a private event</span>
              </label>

              <p id="edit-event-error" class="form-error" role="alert"></p>
              <p id="edit-event-success" class="form-success" role="status"></p>

              <button type="submit" class="btn-primary form-submit">Save changes</button>
            </form>
          </section>

          <!-- Invitations panel: only meaningful for private events -->
          <section class="app-card" id="invitations-card" style="margin-bottom:1.5rem" hidden>
            <h2 class="app-section-title" style="margin-top:0">Send an invitation</h2>
            <p class="rm-sub" style="margin-bottom:1rem">
              Invite people by email to this private event. They'll get a link to accept.
            </p>
            <form id="invite-form" novalidate>
              <div class="form-group">
                <label for="invite-email-input">Email address</label>
                <input type="email" id="invite-email-input" name="email" placeholder="guest@example.com" />
              </div>
              <p id="invite-error" class="form-error" role="alert"></p>
              <p id="invite-success" class="form-success" role="status"></p>
              <button type="submit" class="btn-primary btn-sm">Send invitation</button>
            </form>
          </section>

          <!-- Danger zone -->
          <section class="app-card">
            <h2 class="app-section-title" style="margin-top:0">Danger zone</h2>
            <p class="rm-sub" style="margin-bottom:1rem">Deleting an event is permanent and removes all its registrations.</p>
            <button type="button" id="edit-event-delete" class="btn-danger">Delete this event</button>
          </section>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
