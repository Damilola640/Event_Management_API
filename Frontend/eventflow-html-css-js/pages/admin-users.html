<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Eventflow Admin</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body data-page="admin-users" data-title="User management">
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-body">
      <header id="app-topbar" class="app-topbar"></header>
      <main class="app-main">

        <div class="rm-header">
          <div>
            <h2 class="rm-title">All users</h2>
            <p class="rm-sub">Read-only directory of every registered account. Admin access only.</p>
          </div>
        </div>

        <div id="admin-users-body">
          <p class="app-message">Loading users…</p>
        </div>

      </main>
    </div>
  </div>

  <!-- User detail drawer -->
  <div class="rm-panel-overlay" id="admin-user-overlay" hidden></div>
  <aside class="rm-panel" id="admin-user-panel" hidden aria-label="User detail">
    <div class="rm-panel-head">
      <h3>User detail</h3>
      <button type="button" class="rm-panel-x" id="admin-user-close" aria-label="Close">×</button>
    </div>
    <div id="admin-user-detail"></div>
  </aside>

  <script src="../js/main.js"></script>
</body>
</html>
