<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Eventflow</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body data-page="profile" data-title="My profile">
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-body">
      <header id="app-topbar" class="app-topbar"></header>
      <main class="app-main">

        <div class="stat-grid">
          <div class="stat-tile">
            <div class="stat-tile-label">Display name</div>
            <div class="stat-tile-value" style="font-size:1.3rem" id="profile-name" data-profile-name>Loading…</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">Email</div>
            <div class="stat-tile-value" style="font-size:1.1rem" id="profile-email" data-profile-email>Loading…</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">Username</div>
            <div class="stat-tile-value" style="font-size:1.1rem" id="profile-username" data-profile-username>Loading…</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">Role</div>
            <div class="stat-tile-value" style="font-size:1.1rem;text-transform:capitalize" id="profile-role" data-profile-role>Loading…</div>
          </div>
        </div>

        <section class="app-card" style="max-width:640px">
          <h2 class="app-section-title" style="margin-top:0">Edit your details</h2>
          <p class="rm-sub" style="margin-bottom:1.25rem">
            Keep your Eventflow details up to date so bookings and event communication stay smooth.
          </p>

          <form id="profile-form" novalidate>
            <div class="form-group">
              <label for="profile-username-input">Username</label>
              <input type="text" id="profile-username-input" name="username" placeholder="Choose a username" autocomplete="username" />
            </div>

            <div class="form-group">
              <label for="profile-email-input">Email address</label>
              <input type="email" id="profile-email-input" name="email" placeholder="you@example.com" autocomplete="email" />
            </div>

            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem">
              <div class="form-group">
                <label for="profile-first-name-input">First name</label>
                <input type="text" id="profile-first-name-input" name="first_name" placeholder="First name" autocomplete="given-name" />
              </div>
              <div class="form-group">
                <label for="profile-last-name-input">Last name</label>
                <input type="text" id="profile-last-name-input" name="last_name" placeholder="Last name" autocomplete="family-name" />
              </div>
            </div>

            <p id="profile-error" class="form-error" role="alert"></p>
            <p id="profile-success" class="form-success" role="status"></p>

            <button type="submit" class="btn-primary form-submit">Save changes</button>
          </form>
        </section>

      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
